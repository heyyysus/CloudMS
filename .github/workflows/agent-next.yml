name: agent-next

# When an agent/issue-* PR merges, start the next sub-issue in the chain by adding
# `agent` to it. This automates the rule #115 already states in prose: "label the
# next one `agent` only after the previous PR has merged."
#
# The chain is read from the tracking issue's ordered list, which is its single
# source of truth — entries look like "4. #130 — description". Renumbering the list
# there is all it takes to reorder the chain.
#
# Fires on any merge of an agent branch, not only auto-merges, so a hand-merge
# advances the chain identically.
#
# Kill switch: put `pipeline:chain-hold` on the tracking issue and nothing advances.
#
# Labels with the PAT on purpose: a GITHUB_TOKEN label-add emits no events, so
# agent-trigger would never fire and the next issue would sit there labelled but idle.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-next
  cancel-in-progress: false

env:
  CHAIN_ISSUE: "115"

jobs:
  advance:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'agent/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.PIPELINE_BOT_TOKEN }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Advance the chain
        run: |
          set -euo pipefail
          merged="${HEAD_REF#agent/issue-}"

          if gh issue view "$CHAIN_ISSUE" --json labels -q '.labels[].name' \
             | grep -qxF "pipeline:chain-hold"; then
            echo "Chain held: #$CHAIN_ISSUE carries pipeline:chain-hold." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # "N. #NNN — description" lines, in order. The leading "N." anchor is what
          # keeps prose references to other issues out of the chain.
          mapfile -t chain < <(gh issue view "$CHAIN_ISSUE" --json body -q .body \
                               | grep -oE '^[0-9]+\. #[0-9]+' | grep -oE '[0-9]+$')
          if (( ${#chain[@]} == 0 )); then
            echo "Could not parse a chain from #$CHAIN_ISSUE." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          idx=-1
          for i in "${!chain[@]}"; do
            [[ "${chain[$i]}" == "$merged" ]] && { idx=$i; break; }
          done
          if (( idx < 0 )); then
            echo "#$merged is not in the chain; nothing to advance." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if (( idx + 1 >= ${#chain[@]} )); then
          cat > "$RUNNER_TEMP/body.md" <<EOF
          #$merged was the last sub-issue in the chain — every step has merged.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
            gh issue comment "$CHAIN_ISSUE" --body-file "$RUNNER_TEMP/body.md"
            exit 0
          fi

          next="${chain[$((idx + 1))]}"
          state=$(gh issue view "$next" --json state -q .state)
          if [[ "$state" != "OPEN" ]]; then
            echo "Next in chain (#$next) is $state; not starting." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # agent-trigger refuses to start while a pipeline:* or needs-human label is
          # present, and only fires on a label-add. Say so rather than adding a label
          # that would silently do nothing.
          labels=$(gh issue view "$next" --json labels -q '.labels[].name')
          if grep -qE '^(pipeline:|needs-human$)' <<< "$labels"; then
            blocking=$(grep -E '^(pipeline:|needs-human$)' <<< "$labels" | paste -sd', ')
          cat > "$RUNNER_TEMP/body.md" <<EOF
          #$merged merged, but this issue already carries \`$blocking\`, which stops
          \`agent-trigger\` from starting it. Clear those labels and add \`agent\` to run it.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
            gh issue comment "$next" --body-file "$RUNNER_TEMP/body.md"
            exit 0
          fi
          if grep -qxF "agent" <<< "$labels"; then
          cat > "$RUNNER_TEMP/body.md" <<EOF
          #$merged merged, but this issue already carries \`agent\`, and \`agent-trigger\`
          only fires on a label-add. Remove \`agent\` and re-add it to run this issue.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
            gh issue comment "$next" --body-file "$RUNNER_TEMP/body.md"
            exit 0
          fi

          gh issue edit "$next" --add-label "agent"
          cat > "$RUNNER_TEMP/body.md" <<EOF
          Starting this issue: #$merged merged in #$PR, and this is next in the chain on #$CHAIN_ISSUE.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          gh issue comment "$next" --body-file "$RUNNER_TEMP/body.md"

      - if: failure()
        run: |
          gh issue comment "$CHAIN_ISSUE" --body "Chain advance after #$PR failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
