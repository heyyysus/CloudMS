name: agent-docs

# Sonnet updates docs/*.md and README.md only when user-facing behaviour or API surface changed,
# as a separate commit, then opens the PR (with the PAT so agent-pr-review fires).

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-docs-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  docs:
    if: github.event.label.name == 'pipeline:docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE: ${{ github.event.issue.number }}
      BRANCH: agent/issue-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-${{ github.event.issue.number }}
          fetch-depth: 0

      - id: gate
        uses: ./.github/actions/check-eligibility
        with:
          issue_number: ${{ env.ISSUE }}
          github_token: ${{ github.token }}

      - if: steps.gate.outputs.eligible != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_BOT_TOKEN }}
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          gh issue edit "$ISSUE" --remove-label "pipeline:docs" --add-label "needs-human"
          gh issue comment "$ISSUE" --body "Docs stage stopped: $REASON."
          exit 1

      - name: Prepare diff
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff origin/main...HEAD --stat -- . ':!pipeline' ':!**/package-lock.json' > "$RUNNER_TEMP/diff.stat"
          # Diff to a file first, then truncate: piping straight into head makes git die
          # of SIGPIPE (exit 141) under pipefail as soon as the diff exceeds the cap, which
          # any change that deletes a generated file does.
          git diff origin/main...HEAD -- . ':!pipeline' ':!**/package-lock.json' ':!**/dist/**' \
            > "$RUNNER_TEMP/diff.full.patch"
          head -n 4000 "$RUNNER_TEMP/diff.full.patch" > "$RUNNER_TEMP/diff.patch"
          { echo "DIFF_STAT<<__S__"; cat "$RUNNER_TEMP/diff.stat"; echo "__S__"; } >> "$GITHUB_ENV"

      - name: Build prompt
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          {
            echo "PROMPT<<__PROMPT__"
            cat <<EOF
          You are the documentation stage of an automated pipeline for the CloudMS repo, on branch $BRANCH
          for GitHub issue #$ISSUE ("$TITLE"). The code is already implemented.

          Read pipeline/$ISSUE/notes.md, then the code diff at $RUNNER_TEMP/diff.patch (changed files:
          $DIFF_STAT
          ).

          Update documentation ONLY if the change affects user-facing behaviour or the API surface:
          - docs/API.md for route/endpoint/shape changes
          - docs/AUTH_SESSIONS_EXPLAINED.md for auth/session behaviour
          - docs/frontend-ui-design.md for new UI conventions/components users of the design system need
          - README.md for setup, env vars, scripts, or deploy steps
          You may only edit files under docs/ and README.md. Never edit PROJECT.md, never add code
          comments, never touch source files. Do not run git.

          Docs you write and the Docs section below are read by a person: write them to the
          "Writing for humans" section of CLAUDE.md.

          Whether or not you changed anything, append a final section to pipeline/$ISSUE/notes.md:
          ## Docs
          one or two lines: which docs were updated, or "no doc changes needed" and why.
          EOF
            echo "__PROMPT__"
          } >> "$GITHUB_ENV"

      - id: claude
        uses: ./.github/actions/claude-run
        with:
          stage: docs
          model: sonnet
          max_turns: 20
          allowed_tools: "Read,Grep,Glob,Edit,Write"
          prompt: ${{ env.PROMPT }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}

      - name: Commit docs
        id: commit
        if: always()
        env:
          STOP_REASON: ${{ steps.claude.outputs.stop_reason }}
        run: |
          set -euo pipefail
          # always() so a cancellation or the 10-minute timeout doesn't throw away docs the
          # stage wrote but never got to commit. Anything outside docs/, README.md and
          # notes.md is discarded: the docs stage may not touch code.
          git add docs README.md "pipeline/$ISSUE/notes.md"
          git checkout -- . 2>/dev/null || true
          git clean -fd -e docs -e README.md >/dev/null 2>&1 || true
          if [[ "$STOP_REASON" == "success" ]]; then
            if ! git diff --cached --quiet -- docs README.md; then
              git commit -m "docs: update for #$ISSUE" -- docs README.md
            fi
            if ! git diff --cached --quiet; then
              git commit -m "pipeline: docs notes for #$ISSUE"
            fi
            git push origin "$BRANCH"
          else
            # Claude didn't finish cleanly (or the run was cancelled before we know why):
            # whatever it had written still goes on the branch, tagged as WIP rather than
            # as a real docs commit.
            #
            # Unlike the planner and the plan reviewer, this does NOT fail the step. Their
            # artifacts feed the next stage, so a partial plan.md drives a bad
            # implementation; the docs stage's only consumer is the PR review, which reads
            # the diff either way. Failing here would strand the issue on `needs-human`
            # and cost a human round to recover documentation that a reviewer was going to
            # read regardless. "Open PR" runs, and "Report an incomplete docs run" below
            # posts the same report-failure body a hard failure would have.
            if ! git diff --cached --quiet; then
              git commit -q -m "wip: docs stopped before finishing (stop reason: ${STOP_REASON:-unknown})"
              echo "wip_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              git push origin "$BRANCH"
            fi
            echo "docs_incomplete=true" >> "$GITHUB_OUTPUT"
            echo "Docs stage did not finish cleanly (stop reason: ${STOP_REASON:-unknown}); checkpointed and continuing to the PR." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_BOT_TOKEN }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          # Tee'd so report-failure can append this step's shell output to its comment.
          exec > >(tee -a "$RUNNER_TEMP/stage.log") 2>&1
          set -euo pipefail
          if gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' | grep -q .; then
            echo "PR already open"
          else
            PATCH="pipeline/$ISSUE/workflow-changes.patch"
            {
              if [[ -f "$PATCH" ]]; then
                # Refs, not Fixes: the workflow change is not in this diff, so an auto-close
                # on merge would close the issue with the fix unapplied (#137 → #144 → #147).
                echo "Refs #$ISSUE"
                echo
                echo "## Apply the workflow patch before merging"
                echo
                echo "The workflow change for this issue is **not in this diff**. It is saved as \`$PATCH\`. Apply it, then merge:"
                echo
                echo '```'
                echo "gh pr checkout $BRANCH"
                echo "git apply $PATCH"
                # git rm too: once applied, the patch is a duplicate of the real file, and
                # leaving it on the branch would merge a stale copy onto main and keep
                # flipping later bodies to Refs.
                echo "git rm $PATCH"
                echo "git add -A .github/workflows && git commit -m 'apply workflow patch for #$ISSUE' && git push"
                echo '```'
                echo
              else
                echo "Fixes #$ISSUE"
                echo
              fi
              echo "Automated implementation by the agent pipeline. Plan, plan review and execution notes are in \`pipeline/$ISSUE/\`."
              echo
              echo "## Plan summary"
              sed -n '/^## Goal/,/^## Files/p' "pipeline/$ISSUE/plan.md" | sed '$d'
              echo
              echo "## Notes"
              sed -n '1,40p' "pipeline/$ISSUE/notes.md"
            } > "$RUNNER_TEMP/pr-body.md"
            gh pr create --base main --head "$BRANCH" --title "$TITLE (#$ISSUE)" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
          gh issue edit "$ISSUE" --remove-label "pipeline:docs" --add-label "pipeline:pr-open"

      # The docs stage is the one that does not fail on an unclean stop, so the
      # `failure()` block below never reports it. Same reporter, same body, same
      # tail and WIP sha — it just runs on a stage that carried on.
      - name: Report an incomplete docs run
        if: success() && steps.commit.outputs.docs_incomplete == 'true'
        uses: ./.github/actions/report-failure
        with:
          stage: docs
          stop_reason: ${{ steps.claude.outputs.stop_reason }}
          target: issue
          number: ${{ env.ISSUE }}
          outcome: stopped early
          resume: >-
            The docs stage stopped early and the PR opened anyway, so this is a notice,
            not a stall. Read the docs part of the diff; to redo them, remove
            `pipeline:pr-open` and add `pipeline:docs`.
          tail: ${{ steps.claude.outputs.tail }}
          wip_sha: ${{ steps.commit.outputs.wip_sha }}
          github_token: ${{ secrets.PIPELINE_BOT_TOKEN }}

      - if: failure()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_BOT_TOKEN }}
        run: |
          gh issue edit "$ISSUE" --remove-label "pipeline:docs" --add-label "needs-human" || true

      - if: failure()
        uses: ./.github/actions/report-failure
        with:
          stage: docs
          stop_reason: ${{ steps.claude.outputs.stop_reason }}
          target: issue
          number: ${{ env.ISSUE }}
          resume: >-
            Fix the cause, remove `needs-human`, and re-add `pipeline:docs` to retry.
          tail: ${{ steps.claude.outputs.tail }}
          wip_sha: ${{ steps.commit.outputs.wip_sha }}
          github_token: ${{ secrets.PIPELINE_BOT_TOKEN }}
