name: agent-sweep

# Every 30 minutes, pick up whatever the event-driven stages missed: a reviewed,
# green agent PR that never merged, and a chain that never advanced.
#
# Pure shell, no model, no waiting loops — a PR that isn't ready yet is skipped
# and retried on the next sweep. Guards match agent-automerge: clean/advisory
# merges, blocking-security never does, CI must be green, and needs-human or
# agent:no-automerge stops it.
#
# Safe alongside agent-automerge/agent-next: every action re-checks current state
# first, so whichever path gets there first wins and the other finds nothing to do.
#
# Scheduled workflows only run from the default branch, so this is inert until
# it reaches main.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: agent-sweep
  cancel-in-progress: false

env:
  CHAIN_ISSUE: "115"

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.PIPELINE_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Merge reviewed, green agent PRs
        run: |
          set -euo pipefail
          prs=$(gh pr list --state open --json number,headRefName,isDraft,mergeable \
                -q '.[] | select(.headRefName | startswith("agent/issue-")) | @base64')
          [[ -n "$prs" ]] || { echo "No open agent PRs."; exit 0; }

          for row in $prs; do
            j=$(base64 -d <<< "$row")
            pr=$(jq -r .number <<< "$j")
            issue=$(jq -r .headRefName <<< "$j"); issue="${issue#agent/issue-}"
            draft=$(jq -r .isDraft <<< "$j")
            mergeable=$(jq -r .mergeable <<< "$j")

            [[ "$draft" == "true" ]] && { echo "#$pr: draft, skipping."; continue; }
            [[ "$mergeable" == "CONFLICTING" ]] && { echo "#$pr: conflicting, skipping."; continue; }

            labels=$(gh issue view "$issue" --json labels -q '.labels[].name')
            grep -qxF "pipeline:pr-reviewed" <<< "$labels" || { echo "#$pr: not reviewed yet."; continue; }
            if grep -qxE 'needs-human|agent:no-automerge' <<< "$labels"; then
              echo "#$pr: held by label."; continue
            fi

            head=$(gh pr view "$pr" --json headRefOid -q .headRefOid)
            roll=$(gh pr view "$pr" --json statusCheckRollup \
                   -q '[.statusCheckRollup[]? | select(.__typename == "CheckRun")]')
            if [[ "$(jq '[.[] | select(.status != "COMPLETED")] | length' <<< "$roll")" != "0" ]]; then
              echo "#$pr: checks still running, next sweep."; continue
            fi
            failed=$(jq -r '[.[] | select(.conclusion != "SUCCESS" and .conclusion != "SKIPPED"
                                          and .conclusion != "NEUTRAL")] | map(.name) | join(", ")' <<< "$roll")
            [[ -n "$failed" ]] && { echo "#$pr: failing checks — $failed."; continue; }

            review=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate \
                     --jq "[.[] | select(.body | contains(\"<!-- pipeline-reviewed: ${head} -->\"))] | last | .body // \"\"")
            [[ -n "$review" ]] || { echo "#$pr: no review for $head."; continue; }
            verdict=$(grep -oE 'PIPELINE-VERDICT: *(clean|advisory|blocking-security)' <<< "$review" \
                      | tail -1 | awk '{print $2}')
            if [[ "$verdict" != "clean" && "$verdict" != "advisory" ]]; then
              echo "#$pr: verdict ${verdict:-unparseable}, not merging."; continue
            fi

            echo "#$pr: merging on verdict $verdict."
            gh pr merge "$pr" --squash --delete-branch
          cat > "$RUNNER_TEMP/body.md" <<EOF
          Auto-merged by the 30-minute sweep on verdict \`$verdict\`.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
            gh pr comment "$pr" --body-file "$RUNNER_TEMP/body.md"
          done

      - name: Advance the chain if it stalled
        run: |
          set -euo pipefail
          if gh issue view "$CHAIN_ISSUE" --json labels -q '.labels[].name' \
             | grep -qxF "pipeline:chain-hold"; then
            echo "Chain held by pipeline:chain-hold."; exit 0
          fi

          mapfile -t chain < <(gh issue view "$CHAIN_ISSUE" --json body -q .body \
                               | grep -oE '^[0-9]+\. #[0-9]+' | grep -oE '[0-9]+$')
          (( ${#chain[@]} > 0 )) || { echo "No chain parsed from #$CHAIN_ISSUE."; exit 0; }

          # Walk to the first still-open entry. Everything before it must be closed,
          # otherwise an earlier step is still in flight and nothing should start.
          for n in "${chain[@]}"; do
            state=$(gh issue view "$n" --json state -q .state)
            [[ "$state" == "CLOSED" ]] && continue

            labels=$(gh issue view "$n" --json labels -q '.labels[].name' || true)
            if grep -qE '^(pipeline:|needs-human$)' <<< "$labels"; then
              echo "#$n is already in flight or needs a human; nothing to start."
            elif grep -qxF "agent" <<< "$labels"; then
              # agent-trigger only fires on a label-add, so a stuck `agent` label
              # never starts anything on its own.
              echo "#$n already carries \`agent\` but no pipeline label — needs a manual re-add."
            else
              echo "Starting #$n."
              gh issue edit "$n" --add-label "agent"
          cat > "$RUNNER_TEMP/body.md" <<EOF
          Starting this issue: it is the next unstarted entry in the chain on #$CHAIN_ISSUE.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
              gh issue comment "$n" --body-file "$RUNNER_TEMP/body.md"
            fi
            exit 0
          done
          echo "Every chain entry is closed."
