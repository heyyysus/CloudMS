name: agent-pr-fixer

# Acts on an agent/issue-* PR the moment agent-pr-review finishes with it:
# merges, fixes, scraps, or escalates. The rules live in
# .claude/agents/pr-fixer.md; this workflow resolves the PR, proves the review
# is current, builds an environment the fixer can actually run tests in, and
# hands it to Opus.
#
# Rounds are self-limiting: fixing pushes to the branch, which re-triggers
# agent-pr-review, whose completion re-triggers this. The fixer counts its own
# marker comments and escalates on the third round rather than looping.
#
# Two ways in. `workflow_run` is the normal one. `issues: labeled` on
# `pipeline:pr-reviewed` exists so the orchestrator's recovery primitive —
# remove the state label, add it back — can actually re-fire this stage; a
# workflow_run-only trigger left `pipeline:pr-reviewed` as the one state its
# hourly sweep could detect but not recover. Both paths fire on a normal
# review (agent-pr-review adds the label with the PAT, which does emit
# events), so the resolve step below refuses a second round on a head that has
# already had one.
#
# Postgres and a full install are present because a fix that has not been run
# is a guess. The whole point of this stage is to stop pushing those.
#
# Control lives on the open issue labelled `orchestrator:log`:
#   fixer:paused → do nothing
#   fixer:live   → act
#   neither      → observe-only; log what it would have done

on:
  workflow_run:
    workflows: [agent-pr-review]
    types: [completed]
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

# One fixer per branch, and never cancelled: it may be mid-merge or mid-push.
# Both event paths have to resolve to the same group, or they do not serialise
# against each other and the duplicate-round guard never sees the first round.
concurrency:
  group: >-
    agent-pr-fixer-${{ github.event_name == 'issues'
    && format('agent/issue-{0}', github.event.issue.number)
    || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      (github.event_name == 'workflow_run'
      && startsWith(github.event.workflow_run.head_branch, 'agent/issue-'))
      || (github.event_name == 'issues'
      && github.event.label.name == 'pipeline:pr-reviewed')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: myapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GH_TOKEN: ${{ secrets.PIPELINE_BOT_TOKEN }}
      BRANCH: >-
        ${{ github.event_name == 'issues'
        && format('agent/issue-{0}', github.event.issue.number)
        || github.event.workflow_run.head_branch }}
      DATABASE_ADMIN_URL: postgresql://postgres:password@localhost:5432/myapp
      DATABASE_URL: postgresql://app:password@localhost:5432/myapp
    steps:
      # Resolving runs before checkout, so the label path can bail on a branch
      # that no longer exists rather than hard-failing on a missing ref. That
      # is why every `gh` call here passes `-R`: there is no git remote to
      # infer the repository from yet.
      - name: Resolve PR, review and control flags
        id: ctx
        run: |
          set -euo pipefail
          issue="${BRANCH#agent/issue-}"
          case "$issue" in ''|*[!0-9]*) echo "Branch $BRANCH carries no issue number."; \
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0;; esac

          # Covers a deleted branch too: deleting the head closes the PR.
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
               --json number -q '.[0].number // ""')
          if [[ -z "$pr" ]]; then
            echo "No open PR for $BRANCH." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          head=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)

          # Only act on a review of the commit that is actually at the head. A
          # stale verdict describes code nobody is looking at any more.
          review=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate \
                   --jq "[.[] | select(.body | contains(\"<!-- pipeline-reviewed: ${head} -->\"))] | last | .body // \"\"")
          if [[ -z "$review" ]]; then
            echo "No review for $head on #$pr; waiting for one." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          verdict=$(grep -oE 'PIPELINE-VERDICT: *(clean|advisory|blocking-security)' <<< "$review" \
                    | tail -1 | awk '{print $2}')

          # One round per review, whichever event got here first. The two
          # triggers both fire on a normal review, and the label path fires
          # again on every orchestrator recovery, so without this a PR would
          # collect duplicate rounds and burn its three-round budget on
          # re-reads of the same verdict.
          reviewed_at=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate \
                        --jq "[.[] | select(.body | contains(\"<!-- pipeline-reviewed: ${head} -->\"))] | last | .created_at // \"\"")
          last_round_at=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate \
                          --jq '[.[] | select(.body | contains("<!-- pr-fixer round -->"))] | last | .created_at // ""')
          if [[ -n "$last_round_at" && "$last_round_at" > "$reviewed_at" ]]; then
            echo "A fixer round already ran on $head (round comment $last_round_at, review $reviewed_at)." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          log=$(gh issue list -R "$GITHUB_REPOSITORY" --label "orchestrator:log" --state open --limit 1 \
                --json number -q '.[0].number // ""')
          if [[ -z "$log" ]]; then
            echo "No orchestrator:log issue; nothing to control or log to." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          flags=$(gh issue view "$log" -R "$GITHUB_REPOSITORY" --json labels -q '.labels[].name')
          if grep -qxF "fixer:paused" <<< "$flags"; then
            echo "Paused by \`fixer:paused\` on #$log." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mode=observe
          if grep -qxF "fixer:live" <<< "$flags"; then
            mode=live
          fi

          rounds=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" --paginate \
                   --jq '[.[] | select(.body | contains("<!-- pr-fixer round -->"))] | length')

          {
            echo "skip=false"
            echo "pr=$pr"
            echo "issue=$issue"
            echo "head=$head"
            echo "verdict=${verdict:-unparseable}"
            echo "log_issue=$log"
            echo "mode=$mode"
            echo "rounds=$rounds"
          } >> "$GITHUB_OUTPUT"
          echo "PR #$pr, issue #$issue, verdict \`${verdict:-unparseable}\`, round $((rounds + 1)), mode \`$mode\`." \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.ctx.outputs.skip != 'true'
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.ctx.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install and set up database
        if: steps.ctx.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          (cd backend && npm ci --legacy-peer-deps && npm run db:push && npm run db:bootstrap)
          (cd frontend && npm ci)

      - name: Build prompt
        if: steps.ctx.outputs.skip != 'true'
        env:
          PR: ${{ steps.ctx.outputs.pr }}
          ISSUE: ${{ steps.ctx.outputs.issue }}
          HEAD_SHA: ${{ steps.ctx.outputs.head }}
          VERDICT: ${{ steps.ctx.outputs.verdict }}
          LOG_ISSUE: ${{ steps.ctx.outputs.log_issue }}
          MODE: ${{ steps.ctx.outputs.mode }}
          ROUNDS: ${{ steps.ctx.outputs.rounds }}
        run: |
          set -euo pipefail
          {
            echo "PROMPT<<__PROMPT__"
            cat .claude/agents/pr-fixer.md
            echo
            echo "---"
            echo
            echo "# This run"
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Pull request: #${PR} (branch \`${BRANCH}\`, head \`${HEAD_SHA}\`)"
            echo "- Issue: #${ISSUE}"
            echo "- Review verdict for this head: **${VERDICT}**"
            echo "- Rounds already taken: ${ROUNDS} (you are on round $((ROUNDS + 1)))"
            echo "- Mode: **${MODE}**"
            echo "- Log issue: #${LOG_ISSUE}"
            echo
            echo "The branch is checked out at the PR head. Dependencies are installed and"
            echo "Postgres is running, so you can run the backend and frontend suites directly."
            echo
            echo "Read the review comment, the issue, and the diff with \`gh\` before deciding."
            echo "Check the changed paths against the deny-list yourself — do not trust the"
            echo "\`risk:\` label alone."
            echo
            if [[ "$MODE" == "live" ]]; then
              echo "You are in **live** mode: act, then log what you did."
            else
              echo "You are in **observe-only** mode: decide exactly as you would in live mode,"
              echo "then write that decision to issue #${LOG_ISSUE} with every line prefixed"
              echo "\`WOULD:\`. Do not edit files, push, merge, close, or relabel anything."
            fi
            echo "__PROMPT__"
          } >> "$GITHUB_ENV"

      - id: claude
        if: steps.ctx.outputs.skip != 'true'
        uses: ./.github/actions/claude-run
        with:
          stage: pr-fixer
          model: opus
          max_turns: 250
          allowed_tools: "Read,Grep,Glob,Bash,Edit,Write"
          prompt: ${{ env.PROMPT }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The bot token, not github.token: a push made with the default
          # GITHUB_TOKEN creates no workflow runs, so CI and agent-pr-review
          # would never re-run and the round would never close. claude-code-action
          # reconfigures git credentials from this input, so the PAT needs
          # `contents: write` for the push itself to land.
          github_token: ${{ secrets.PIPELINE_BOT_TOKEN }}

      - name: Report a run that did not finish
        if: steps.ctx.outputs.skip != 'true' && steps.claude.outputs.stop_reason != 'success'
        env:
          LOG_ISSUE: ${{ steps.ctx.outputs.log_issue }}
          PR: ${{ steps.ctx.outputs.pr }}
          STOP_REASON: ${{ steps.claude.outputs.stop_reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/body.md" <<EOF
          PR fixer on #${PR} did not finish cleanly (stop reason: \`${STOP_REASON:-unknown}\`).

          $RUN_URL

          Anything it pushed stands. If it pushed, agent-pr-review runs again and the next
          round starts from there; if it did not, the PR is unchanged.
          EOF
          gh issue comment "$LOG_ISSUE" --body-file "$RUNNER_TEMP/body.md"
