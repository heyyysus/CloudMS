name: cloudms-demo

services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The same config production uses - the demo runs on its own host, so
      # there is no port conflict and no reason to keep a second copy of it.
      # The cert mounted here is the demo hostname's own Cloudflare Origin CA
      # cert, not production's (see docs/demo-deployment.md).
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - app
    restart: always

  app:
    image: ghcr.io/heyyysus/cloudms-app:latest
    env_file:
      - .env.demo
    environment:
      # Set here too, not only in .env.demo, so demo mode can't be lost by an
      # incomplete env file.
      - DEMO_MODE=true
      - DATABASE_URL=postgresql://postgres:password@db:5432/myapp_demo
    depends_on:
      - db
    restart: always

  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myapp_demo
    volumes:
      # Its own volume - never postgres_data, which is production's.
      - postgres_data_demo:/var/lib/postgresql
    restart: always
    # Loopback only, same as production's. The demo has its own host, so it
    # can use the same port without colliding with anything.
    ports:
      - "127.0.0.1:5433:5432"

volumes:
  postgres_data_demo:
