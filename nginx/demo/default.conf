# Plain HTTP, unlike nginx/conf.d/default.conf: the demo doesn't hold the
# production Cloudflare origin cert, and both stacks would fight over 443 if
# it tried to listen there too. Front this with the production nginx or a
# Cloudflare Tunnel if the demo needs HTTPS on the same host.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Same /api/v1 -> app contract as production's config.
    location /api/v1/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
