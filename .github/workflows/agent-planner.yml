name: agent-planner

# Opus writes pipeline/<n>/plan.md on branch agent/issue-<n>.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: agent-planner-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event.label.name == 'pipeline:needs-plan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ISSUE: ${{ github.event.issue.number }}
      BRANCH: agent/issue-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: gate
        uses: ./.github/actions/check-eligibility
        with:
          issue_number: ${{ env.ISSUE }}
          github_token: ${{ github.token }}

      - if: steps.gate.outputs.eligible != 'true'
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_BOT_TOKEN }}
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          gh issue edit "$ISSUE" --remove-label "pipeline:needs-plan" --add-label "needs-human"
          gh issue comment "$ISSUE" --body "Planner stopped: $REASON."
          exit 1

      - name: Prepare branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH" origin/main
          fi
          mkdir -p "pipeline/$ISSUE"

      - name: Build prompt
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
        run: |
          {
            echo "PROMPT<<__PROMPT__"
            cat <<EOF
          You are the planning stage of an automated pipeline for the CloudMS repo. You are running on an
          isolated CI runner, so the "Concurrent agents" rules in CLAUDE.md about the shared working tree,
          worktrees and the shared Postgres container do not apply here; everything else in CLAUDE.md does.

          Task: write an implementation plan for GitHub issue #$ISSUE to the file
          pipeline/$ISSUE/plan.md. Do not implement anything and do not run git commit/push;
          the workflow commits the file.

          First read CLAUDE.md and PROJECT.md (goals, current state, roadmap). Then explore only the
          code areas the issue touches. Keep exploration focused; you have a limited turn budget.

          Everything in plan.md is read by a person, and its opening sections are pasted into
          the PR body, so write it to the "Writing for humans" section of CLAUDE.md. The
          section headings below are a required format and win where the two conflict.

          Budget: 450 words for the whole file, headings included — 650 if the triage labels
          below include risk:high. Check with wc -w before you finish; over budget, cut, do not
          reword. Every heading below must appear even when the answer is one line ("None.").
          Approach is numbered one-liners naming the file and the change, not paragraphs. Do not
          restate the issue back: Goal says what done looks like, not what is wrong today. Read
          "Cut these five things first" in CLAUDE.md and apply it before you write, not after.

          plan.md format:
          ---
          issue: $ISSUE
          status: pending-review
          ---
          # <short title>
          ## Goal            – what "done" means, in terms of the issue
          ## Scope check     – how this fits PROJECT.md (pillars / roadmap); note if triage labels look wrong
          ## Files / areas   – concrete paths to add or change (backend/, frontend/, docs/)
          ## Approach        – step-by-step, referencing existing functions/patterns to reuse
          ## Tests           – what to add/run (backend: vitest + TestContext fixtures; frontend: existing lint/build)
          ## Touches backend – yes/no (the commit hook runs the backend test suite when yes)
          ## Risks / open questions
          ## Out of scope

          If the issue is too vague to plan concretely, say so explicitly in Goal and list the questions
          that need answers instead of inventing scope.

          Issue #$ISSUE: $TITLE
          Triage labels (Haiku's guess, may be wrong): $LABELS

          Issue body:
          $BODY
          EOF
            echo "__PROMPT__"
          } >> "$GITHUB_ENV"

      - id: claude
        uses: ./.github/actions/claude-run
        with:
          stage: planner
          model: opus
          max_turns: 40
          allowed_tools: "Read,Grep,Glob,Write,Edit,Bash(git log *),Bash(git diff *),Bash(ls *)"
          prompt: ${{ env.PROMPT }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}

      - name: Commit plan
        id: commit
        if: always()
        env:
          STOP_REASON: ${{ steps.claude.outputs.stop_reason }}
        run: |
          set -euo pipefail
          # always() so a cancellation or the 15-minute timeout doesn't throw away a plan
          # Claude was still writing. A non-success stop reason always fails this step (even
          # after checkpointing) so "Advance state" is skipped and the failure() block below
          # reports it — a partial plan.md must never reach plan review as if it were real.
          if [[ "$STOP_REASON" == "success" ]]; then
            test -s "pipeline/$ISSUE/plan.md" || { echo "plan.md was not written"; exit 1; }
            git add "pipeline/$ISSUE/plan.md"
            git commit -m "pipeline: plan for #$ISSUE"
            git push origin "$BRANCH"
          else
            if [[ -s "pipeline/$ISSUE/plan.md" ]] || [[ -n "$(git status --porcelain)" ]]; then
              git add -A
              git commit -q -m "wip: planner stopped before finishing (stop reason: ${STOP_REASON:-unknown})"
              echo "wip_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              git push origin "$BRANCH"
            fi
            echo "Planner did not finish cleanly (stop reason: ${STOP_REASON:-unknown})"
            exit 1
          fi

      - name: Advance state
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_BOT_TOKEN }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/blob/${BRANCH}/pipeline/${ISSUE}/plan.md"
          gh issue comment "$ISSUE" --body "Plan written: $url — sending to plan review."
          gh issue edit "$ISSUE" --remove-label "pipeline:needs-plan" --add-label "pipeline:plan-ready"

      - if: failure()
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_BOT_TOKEN }}
        run: |
          gh issue edit "$ISSUE" --remove-label "pipeline:needs-plan" --add-label "needs-human" || true

      - if: failure()
        uses: ./.github/actions/report-failure
        with:
          stage: planner
          stop_reason: ${{ steps.claude.outputs.stop_reason }}
          target: issue
          number: ${{ env.ISSUE }}
          resume: >-
            Fix the cause, remove `needs-human`, and re-add `pipeline:needs-plan` to retry
            (a partial `plan.md`, if any, is on `${{ env.BRANCH }}` as a `wip:` commit — treat it
            as incomplete).
          tail: ${{ steps.claude.outputs.tail }}
          wip_sha: ${{ steps.commit.outputs.wip_sha }}
          github_token: ${{ secrets.PIPELINE_BOT_TOKEN }}
