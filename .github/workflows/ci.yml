name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      actions: ${{ steps.filter.outputs.actions }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'nginx/**'
              - 'scripts/**'
              - 'docker-compose.yml'
              - 'docker-compose.build.yml'
              - '.github/workflows/ci.yml'
            actions:
              - '.github/actions/**'
              - '.github/workflows/**'
              - '.github/tests/**'

  pipeline-actions:
    needs: changes
    if: needs.changes.outputs.actions == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The failure comments the pipeline posts are only as good as this renderer,
      # and its caps and secret redaction are not exercised by any stage's own tests.
      - name: claude-run tail renderer
        run: bash .github/actions/claude-run/render-tail.test.sh

      - name: report-failure log renderer
        run: bash .github/actions/report-failure/render-log.test.sh

      - name: report-failure headline renderer
        run: bash .github/actions/report-failure/render-headline.test.sh

      - name: agent-docs PR body
        run: bash .github/tests/pr-body.test.sh

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # coverage summary comment on PRs
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: myapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_ADMIN_URL: postgresql://postgres:password@localhost:5432/myapp
      DATABASE_URL: postgresql://app:password@localhost:5432/myapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --legacy-peer-deps

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Runs the same push + role grants + bootstrap as the production
      # container's CMD (dist/db/roles.js, dist/db/bootstrap.js), so the suite
      # runs against the same baseline and as the app role like production.
      # Since #162 bootstrap seeds only the automation user and
      # PLATFORM_OWNER_EMAIL (unset here, so that half no-ops) - no default
      # org, no admin user, and no welcome template: TestContext.org() seeds
      # each test org's own.
      - run: npm run db:push
      - run: npm run db:bootstrap
      # Coverage is report-only (no thresholds in vitest.config.ts): it tracks
      # the metric without gating the build.
      - run: npm run test:coverage

      - name: Coverage summary
        if: always() && hashFiles('backend/coverage/coverage-summary.json') != ''
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: backend
          json-summary-path: coverage/coverage-summary.json
          file-coverage-mode: changes

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('backend/coverage/lcov.info') != ''
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          retention-days: 7

      - run: npm run build

  image:
    needs: backend
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/heyyysus/cloudms-app:latest
            ghcr.io/heyyysus/cloudms-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Longer than start.sh's own wait for the app, so a failed boot ends
          # with the container logs it prints rather than a bare SSH timeout.
          command_timeout: 15m
          # Pull here rather than leaving it to start.sh: the script pulls the
          # very file it is running, so any change to it would otherwise sit
          # unused for one deploy - including changes to how a failure reports.
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            bash scripts/start.sh
